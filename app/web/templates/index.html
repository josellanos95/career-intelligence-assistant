<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Career Intelligence Assistant</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-50 text-slate-900">
  <div class="max-w-5xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

    <section class="md:col-span-1 space-y-6">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <h2 class="font-semibold text-lg mb-3">Your Resume</h2>
        <form hx-post="/ui/upload" hx-target="#documents-panel" hx-swap="innerHTML"
              hx-encoding="multipart/form-data" hx-on::after-request="this.reset()" class="space-y-2">
          <input type="hidden" name="doc_type" value="resume" />
          <input type="file" name="file" required class="block w-full text-sm" accept=".pdf,.docx,.txt" />
          <button class="w-full bg-slate-900 text-white rounded-lg py-2 text-sm font-medium">Upload resume</button>
        </form>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
        <h2 class="font-semibold text-lg mb-3">Job Descriptions</h2>
        <form hx-post="/ui/upload" hx-target="#documents-panel" hx-swap="innerHTML"
              hx-encoding="multipart/form-data" hx-on::after-request="this.reset()" class="space-y-2">
          <input type="hidden" name="doc_type" value="job_description" />
          <input type="text" name="title" placeholder="Job title (optional)"
                 class="block w-full text-sm border border-slate-300 rounded-lg px-2 py-1.5" />
          <input type="file" name="file" required class="block w-full text-sm" accept=".pdf,.docx,.txt" />
          <button class="w-full bg-slate-900 text-white rounded-lg py-2 text-sm font-medium">Add job</button>
        </form>
      </div>

      <div id="documents-panel">
        {% include "_documents_list.html" %}
      </div>
    </section>

    <section class="md:col-span-2 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 h-[80vh]">
      <div class="p-4 border-b border-slate-200">
        <h1 class="font-bold text-xl">Career Intelligence Assistant</h1>
        <p class="text-sm text-slate-500">Ask about your fit, skill gaps, or interview prep for any uploaded job.</p>
      </div>

      <div id="chat-log" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

      <form hx-post="/ui/chat" hx-target="#chat-log" hx-swap="beforeend" hx-on::after-request="this.reset()"
            class="p-4 border-t border-slate-200 space-y-2">
        <div class="flex gap-2">
          <select name="mode" class="border border-slate-300 rounded-lg text-sm px-2">
            <option value="general">General Q&amp;A</option>
            <option value="skill_gap">Skill-gap analysis</option>
            <option value="interview_prep">Interview prep</option>
          </select>
          {% include "_doc_select.html" %}
        </div>
        <div class="flex gap-2">
          <input type="text" name="question" required placeholder="e.g. What skills am I missing for this role?"
                 class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          <button class="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm font-medium">Send</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    document.body.addEventListener('htmx:afterSwap', () => {
      const log = document.getElementById('chat-log');
      if (log) log.scrollTop = log.scrollHeight;
    });
  </script>
</body>
</html>
